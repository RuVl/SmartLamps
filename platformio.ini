; SmartLamp v2 — one source tree, two boards.
;
; esp32s3  — lamp A: ESP32-S3-DevKitC-1 N16R8, hardware RMT output, microphone, voice.
; d1_mini  — lamp B: legacy ESP8266, NeoPixelBus DMA output on GPIO3, no audio.
; native   — host build for core tests (no hardware, no Arduino).

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------- shared ----
; [env] applies to every environment, native included, so it carries only what
; is true everywhere. Anything Arduino-specific lives in [hw] and is pulled in
; explicitly by the two board environments.
[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DMATRIX_WIDTH=16
    -DMATRIX_HEIGHT=16
    -DEFFECT_ARENA_SIZE=768
build_unflags = -std=gnu++11

[hw]
framework = arduino
lib_ldf_mode = chain+
monitor_filters = default, time
lib_deps =
    fastled/FastLED@^3.10.3
    https://github.com/GyverLibs/Settings.git
    gyverlibs/GyverDB@^1.4.4
    gyverlibs/EncButton@^3.7.6
    gyverlibs/WiFiConnector@^1.0.4
    bblanchon/ArduinoJson@^7.2.0

; ------------------------------------------------------------- lamp A: S3 ----
[env:esp32s3]
extends = hw
platform = espressif32
board = esp32-s3-devkitc-1
; N16R8: quad-SPI flash + octal PSRAM. The stock esp32-s3-devkitc-1 board
; definition is the N8 variant with no PSRAM, so both the memory layout and the
; flash size have to be overridden here. Without memory_type the build links the
; qio_qspi SDK and ESP.getPsramSize() returns 0 on a perfectly good board.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/esp32s3.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DLAMP_BOARD_ESP32S3
    -DLED_CURRENT_LIMIT_MA=3000
build_src_filter = +<*> -<hal/esp8266/>
lib_deps =
    ${hw.lib_deps}
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    heman/AsyncMqttClient-esphome@^2.1.0

; ---------------------------------------------------------- lamp B: 8266 ----
[env:d1_mini]
extends = hw
platform = espressif8266
board = d1_mini
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 74880
build_type = debug
monitor_filters = esp8266_exception_decoder, default
build_flags =
    ${env.build_flags}
    -DLAMP_BOARD_ESP8266
    -DLED_CURRENT_LIMIT_MA=3000
build_src_filter = +<*> -<hal/esp32/> -<audio/>
lib_deps =
    ${hw.lib_deps}
    makuna/NeoPixelBus@^2.8.4
    esphome/ESPAsyncTCP-esphome@^2.0.0
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    heman/AsyncMqttClient-esphome@^2.1.0

; ------------------------------------------------------ host tests: core ----
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DMATRIX_WIDTH=16
    -DMATRIX_HEIGHT=16
    -DEFFECT_ARENA_SIZE=768
    -DLAMP_HOST_BUILD
    -I src
build_src_filter = +<core/> +<effects/>
lib_deps =
    fastled/FastLED@^3.10.3
