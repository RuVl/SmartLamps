; SmartLamp - one source tree, two boards.
;
; esp32s3  - lamp A: ESP32-S3-DevKitC-1 N16R8, hardware RMT output, microphone, voice.
; d1_mini  - lamp B: legacy ESP8266, NeoPixelBus DMA output on GPIO3, no audio.
; sim      - simulation: preview effects in browser during development.
; native   - host build for core tests (no hardware, no Arduino).

[platformio]
default_envs = esp32s3
; Local secrets: the access point, OTA and web panel passwords. The file is
; gitignored; copy secrets.ini.example to secrets.ini and edit. Without it the
; defaults from [secrets] below apply.
extra_configs = secrets.ini

; Overridden by secrets.ini. Kept here so a fresh checkout still builds - but
; a lamp flashed with these is only as private as this file.
[secrets]
ap_pass = smartlamp
ota_pass = smartlamp
; Initial web panel password. Written to the database on the first boot; the
; owner changes it in the panel afterwards. Empty = panel without a password.
panel_pass = smartlamp

; ---------------------------------------------------------------- shared ----
; [env] applies to every environment, native included, so it carries only what
; is true everywhere. Anything Arduino-specific lives in [hw] and is pulled in
; explicitly by the two board environments.
[env]
; -Wall/-Wextra apply to src/ only: third-party libraries are not ours to keep
; warning-free, and their noise would bury a real warning in our own code.
build_src_flags = -Wall -Wextra
build_flags =
    -std=gnu++17
    -DMATRIX_WIDTH=16
    -DMATRIX_HEIGHT=16
    -DEFFECT_ARENA_SIZE=768
build_unflags = -std=gnu++11

[hw]
framework = arduino
lib_ldf_mode = chain+
monitor_filters = default, time
build_flags =
    ${env.build_flags}
    -DLAMP_AP_PASS=\"${secrets.ap_pass}\"
    -DLAMP_OTA_PASS=\"${secrets.ota_pass}\"
    -DLAMP_PANEL_PASS=\"${secrets.panel_pass}\"
lib_deps =
    fastled/FastLED@^3.10.3
    gyverlibs/Settings@^1.4.3
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    heman/AsyncMqttClient-esphome@^2.1.0
    gyverlibs/GyverDB@^1.4.4
    gyverlibs/EncButton@^3.7.6
    gyverlibs/WiFiConnector@^1.0.4
    bblanchon/ArduinoJson@^7.2.0

; ------------------------------------------------------------- lamp A: S3 ----
[env:esp32s3]
extends = hw
platform = espressif32
board = esp32-s3-devkitc-1
; N16R8: quad-SPI flash + octal PSRAM. The stock esp32-s3-devkitc-1 board
; definition is the N8 variant with no PSRAM, so both the memory layout and the
; flash size have to be overridden here. Without memory_type the build links the
; qio_qspi SDK and ESP.getPsramSize() returns 0 on a perfectly good board.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/esp32s3.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
build_flags =
    ${hw.build_flags}
    -DBOARD_HAS_PSRAM
    -DLAMP_BOARD_ESP32S3
    -DLED_CURRENT_LIMIT_MA=3000
    -DLED_DATA_PIN=4
    -DBUTTON_PIN=5
    -DSERIAL_BAUD=115200
build_src_filter = +<*> -<hal/esp8266/> -<hal/sim/> -<sim/>
lib_deps =
    ${hw.lib_deps}

; ---------------------------------------------------------- lamp B: 8266 ----
[env:d1_mini]
extends = hw
platform = espressif8266
board = d1_mini
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 74880
; Release, not debug: at -O0 NeoPixelBus's DMA method fails to link
; (undefined reference to NeoEsp8266I2sMethodCore::c_StateDataSize).
; The exception decoder works regardless of the build type.
monitor_filters = esp8266_exception_decoder, default
build_flags =
    ${hw.build_flags}
    -DLAMP_BOARD_ESP8266
    -DLED_CURRENT_LIMIT_MA=3000
    ; DMA output is wired to GPIO3 in hardware; the value is documentation.
    -DLED_DATA_PIN=3
    ; 4 I2S steps per bit: T0H 312 ns instead of the 3-step default's 416 ns.
    ; WS2812B V5 and most clones specify T0H <= 380 ns; with 3.3 V logic into a
    ; 5 V input the 3-step zero reads as a one and an all-zero frame (lamp off,
    ; brightness 1-4 %) lights random pixels. Costs 768 bytes of I2S buffer.
    -DNPB_CONF_4STEP_CADENCE
    ; Uncomment when a level-shifting WS2812B is wired before the matrix
    ; (fed through a 1N4007; see docs/hardware notes). It is kept black.
    ; -DLED_LEAD_PIXELS=1
    ; Uncomment when the data line goes through an inverting transistor stage.
    ; Drop NPB_CONF_4STEP_CADENCE with it: the transistor's storage delay eats
    ; ~80 ns of the zero pulse, and the 3-step 416 ns zero lands on spec.
    ; -DLED_DATA_INVERTED
    -DBUTTON_PIN=4
    -DSERIAL_BAUD=74880
build_src_filter = +<*> -<hal/esp32/> -<hal/sim/> -<audio/> -<sim/>
lib_deps =
    ${hw.lib_deps}
    makuna/NeoPixelBus@^2.8.4

; Effect preview on the PC - the same core/ and effects/, no board needed
[env:sim]
platform = native
; FastLED declares itself Arduino-only; on the host it runs on its stub
; platform, which the dependency finder only picks up with compatibility off.
lib_compat_mode = off
; page.py embeds src/sim/index.html into src/sim/page.h (gitignored), which
; HttpServer.cpp includes - the page is a real file, not a raw string in code.
extra_scripts = pre:src/sim/page.py
build_src_flags = ${env.build_src_flags}
build_flags =
    ${env.build_flags}
    -DLAMP_HOST_BUILD
    -DFASTLED_STUB_IMPL
    ; Same supply as the boards, so a white frame dims exactly as on the lamp.
    -DLED_CURRENT_LIMIT_MA=3000
    -I src
build_src_filter = -<*> +<sim/> +<core/> +<hal/sim/> +<app/> +<effects/>
lib_deps =
    fastled/FastLED@^3.10.3
    bblanchon/ArduinoJson@^7.2.0

; ------------------------------------------------------ host tests: core ----
[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Same reason as in [env:sim]: FastLED's host stub is only found with
; compatibility checks off.
lib_compat_mode = off
build_src_flags = ${env.build_src_flags}
build_flags =
    ${env.build_flags}
    -DLAMP_HOST_BUILD
    -DFASTLED_STUB_IMPL
    -I src
build_src_filter = +<core/> +<effects/>
lib_deps =
    fastled/FastLED@^3.10.3
